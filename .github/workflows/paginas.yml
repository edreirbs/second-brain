name: Publicar el cerebro

# Sin filtro de ramas a propósito: el trabajo se salta solo si el push no va
# a la rama principal, así el nombre de esa rama no queda escrito a mano aquí.
on:
  push:
    paths: ['sitio/**', '.github/workflows/paginas.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos publicadas seguidas, gana la última y no se cancela a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages tiene que estar prendido antes (Settings -> Pages -> GitHub
      # Actions). No se puede desde aquí: crear el sitio pide permiso de
      # admin y el GITHUB_TOKEN del workflow no lo tiene.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
